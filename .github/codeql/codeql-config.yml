name: "BountyReaper CodeQL Config"

# Post-exploit tooling directories contain offensive security payloads that
# intentionally handle secrets, credentials, and perform actions that static
# analyzers flag as vulnerabilities. These are features, not bugs.
paths-ignore:
  - packages/bountyreaper/data/awshook
  - packages/bountyreaper/data/azurehook
  - packages/bountyreaper/data/cipipe
  - packages/bountyreaper/data/ebpf
  - packages/bountyreaper/data/kubehook
  - packages/bountyreaper/data/machook
  - packages/bountyreaper/data/winhook
