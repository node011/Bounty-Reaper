name: bountyreper

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  bountyreper:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /bountyreper') ||
      startsWith(github.event.comment.body, '/bountyreper')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run bountyreper
        uses: node011/Bounty-Reper/github@latest
        env:
          BOUNTYREPER_API_KEY: ${{ secrets.BOUNTYREPER_API_KEY }}
          BOUNTYREPER_PERMISSION: '{"bash": "deny"}'
        with:
          model: bountyreper/claude-opus-4-5
