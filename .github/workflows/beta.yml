name: beta

on:
  workflow_dispatch:
  # Hourly schedule inherited from upstream — DISABLED on this fork: it requires the
  # BOUNTYREAPER_APP_ID/SECRET GitHub App credentials that only exist on the upstream
  # repo, so every scheduled run failed (13+ failures on record). The beta-branch
  # PR-label automation is an upstream release-process step not used here. Manual runs
  # stay available via workflow_dispatch if the app credentials are ever configured.

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          bountyreaper-app-id: ${{ vars.BOUNTYREAPER_APP_ID }}
          bountyreaper-app-secret: ${{ secrets.BOUNTYREAPER_APP_SECRET }}

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
        run: bun script/beta.ts
