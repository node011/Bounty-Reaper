name: bountyreaper

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  bountyreaper:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /bountyreaper') ||
      startsWith(github.event.comment.body, '/bountyreaper')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run bountyreaper
        uses: node011/Bounty-Reaper/github@latest
        env:
          BOUNTYREAPER_API_KEY: ${{ secrets.BOUNTYREAPER_API_KEY }}
          BOUNTYREAPER_PERMISSION: '{"bash": "deny"}'
        with:
          model: bountyreaper/claude-opus-4-5
