<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="BountyReaper — the open-source AI agent built for offensive security">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505"/>
      <stop offset="50%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="46%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="400" fill="url(#bg)"/>
  <rect width="880" height="400" fill="url(#glow)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="40" x2="880" y2="40"/>
    <line x1="0" y1="80" x2="880" y2="80"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="160" x2="880" y2="160"/>
    <line x1="0" y1="200" x2="880" y2="200"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="0" y1="280" x2="880" y2="280"/>
    <line x1="0" y1="320" x2="880" y2="320"/>
    <line x1="0" y1="360" x2="880" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
  </g>

  <!-- Mark: crosshair over a shield notch -->
  <g transform="translate(440 108)" fill="none" stroke="url(#accent)" stroke-width="2.5">
    <circle r="30" opacity="0.85"/>
    <circle r="7" fill="#60a5fa" stroke="none"/>
    <line x1="0" y1="-44" x2="0" y2="-34"/>
    <line x1="0" y1="34" x2="0" y2="44"/>
    <line x1="-44" y1="0" x2="-34" y2="0"/>
    <line x1="34" y1="0" x2="44" y2="0"/>
    <path d="M -18 -18 L -18 -26 L -10 -26" opacity="0.5"/>
    <path d="M 18 18 L 18 26 L 10 26" opacity="0.5"/>
  </g>

  <text x="440" y="212" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="9" fill="#f0f6fc">BOUNTYREAPER</text>

  <text x="440" y="243" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14" font-style="italic" fill="#8b949e">The open-source AI agent built for offensive security.</text>

  <line x1="290" y1="272" x2="590" y2="272" stroke="#30363d" stroke-width="1"/>

  <!-- Stats: figures verified against the source tree -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="152" y="318" font-size="27" font-weight="700" fill="#60a5fa">14</text>
    <text x="152" y="340" font-size="10" letter-spacing="2" fill="#6e7681">AGENTS</text>

    <text x="316" y="318" font-size="27" font-weight="700" fill="#60a5fa">69</text>
    <text x="316" y="340" font-size="10" letter-spacing="2" fill="#6e7681">TOOLS</text>

    <text x="480" y="318" font-size="27" font-weight="700" fill="#60a5fa">900+</text>
    <text x="480" y="340" font-size="10" letter-spacing="2" fill="#6e7681">ATT&amp;CK TECHNIQUES</text>

    <text x="644" y="318" font-size="27" font-weight="700" fill="#60a5fa">213</text>
    <text x="644" y="340" font-size="10" letter-spacing="2" fill="#6e7681">LLM PROVIDERS</text>

    <text x="792" y="318" font-size="27" font-weight="700" fill="#60a5fa">120+</text>
    <text x="792" y="340" font-size="10" letter-spacing="2" fill="#6e7681">OWASP WSTG</text>
  </g>

  <g opacity="0.35">
    <line x1="234" y1="300" x2="234" y2="344" stroke="#30363d" stroke-width="1"/>
    <line x1="398" y1="300" x2="398" y2="344" stroke="#30363d" stroke-width="1"/>
    <line x1="562" y1="300" x2="562" y2="344" stroke="#30363d" stroke-width="1"/>
    <line x1="718" y1="300" x2="718" y2="344" stroke="#30363d" stroke-width="1"/>
  </g>
