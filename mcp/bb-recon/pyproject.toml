[project]
name = "bb-recon"
version = "0.1.0"
description = "BountyReaper bug bounty recon MCP - passive subdomain enumeration, DNS resolution, HTTP probing"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.scripts]
bb-recon = "bb_recon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bb_recon"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
