[project]
name = "mythos-reaper"
version = "0.1.0"
description = "BountyReaper Mythos audit harness MCP — one engine, two modes (white-box sink scoring / black-box threat model), Gate A probe promotion (baseline-vs-exploit delta + sink correlation)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
mythos-reaper-mcp = "mythos_reaper.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mythos_reaper"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
